name: Terraform plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/plan.yml"

permissions:
  id-token: write # OIDC token for AWS
  contents: read
  pull-requests: write # post the plan as a PR comment

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::265751834658:role/github-actions-plan
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      # ec2.tf reads the real public key, so the plan matches what is deployed.
      - name: Write SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.SSH_PUBLIC_KEY }}" > ~/.ssh/devops-bootcamp.pub

      - name: Init
        run: terraform init -input=false
        working-directory: terraform

      # -lock=false: the plan role is read-only and a plan never writes state.
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false -out=tfplan 2>&1 | tee plan.txt
        working-directory: terraform

      - name: Post plan to PR
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          {
            echo "### Terraform plan: ${OUTCOME}"
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            tail -c 60000 terraform/plan.txt
            echo '```'
            echo "</details>"
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file comment.md --edit-last --create-if-none
