---
- name: Install and run cloudflared tunnel on the monitoring server
  hosts: monitoring
  become: true
  tasks:
    - name: Add Cloudflare's GPG key
      ansible.builtin.get_url:
        url: https://pkg.cloudflare.com/cloudflare-main.gpg
        dest: /usr/share/keyrings/cloudflare-main.gpg
        mode: "0644"

    - name: Add Cloudflare's apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared {{ ansible_distribution_release }} main"
        filename: cloudflared
        state: present

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
        update_cache: true

    - name: Install the tunnel as a systemd service
      ansible.builtin.command:
        cmd: "cloudflared service install {{ cloudflare_tunnel_token }}"
        creates: /etc/cloudflared/config.yml
      no_log: true

    - name: Ensure cloudflared service is enabled and running
      ansible.builtin.systemd:
        name: cloudflared
        enabled: true
        state: started
