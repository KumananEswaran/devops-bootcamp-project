---
- name: Deploy Prometheus and Grafana to the monitoring server
  hosts: monitoring
  become: true
  tasks:
    - name: Create the monitoring config directory
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        mode: "0755"

    - name: Copy the Prometheus scrape config
      ansible.builtin.copy:
        src: files/prometheus.yml
        dest: /opt/monitoring/prometheus.yml
        mode: "0644"

    - name: Copy the docker-compose file
      ansible.builtin.copy:
        src: files/docker-compose-monitoring.yml
        dest: /opt/monitoring/docker-compose.yml
        mode: "0644"

    - name: Start Prometheus and Grafana via docker compose
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        state: present
